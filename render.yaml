services:
  - type: web
    name: nekoria-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @nekoria/web build
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: nekoria-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @nekoria/server build
    startCommand: pnpm --filter @nekoria/server start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
